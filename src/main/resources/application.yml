spring:
  application:
    name: sky-takeout
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/sky_takeout?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}

server:
  port: 8080

sky:
  upload:
    path: ${UPLOAD_PATH:./uploads}
    url-prefix: /uploads
    max-file-size: 5242880
  jwt:
    secret: ${JWT_SECRET:sky-takeout-learning-secret-change-before-production-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:7200000}
  auth:
    enabled: ${AUTH_ENABLED:true}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    api-url: ${WECHAT_API_URL:https://api.weixin.qq.com/sns/jscode2session}
    mock-enabled: ${WECHAT_MOCK_ENABLED:false}
  cache:
    enabled: ${CACHE_ENABLED:true}
    ttl: ${CACHE_TTL:10m}
    ttl-jitter: ${CACHE_TTL_JITTER:60s}
    miss-ttl: ${CACHE_MISS_TTL:2m}
    key-prefix: ${CACHE_KEY_PREFIX:sky:cache:}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.takeout.entity
  configuration:
    map-underscore-to-camel-case: true
