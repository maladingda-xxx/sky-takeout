spring:
  application:
    name: sky-takeout
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/sky_takeout?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

server:
  port: 8080

sky:
  upload:
    path: ${UPLOAD_PATH:./uploads}
    url-prefix: /uploads
    max-file-size: 5242880
  jwt:
    secret: ${JWT_SECRET:sky-takeout-learning-secret-change-before-production-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:7200000}
  auth:
    enabled: ${AUTH_ENABLED:true}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    api-url: ${WECHAT_API_URL:https://api.weixin.qq.com/sns/jscode2session}
    mock-enabled: ${WECHAT_MOCK_ENABLED:false}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.takeout.entity
  configuration:
    map-underscore-to-camel-case: true
